[project]
name = "viku-engine"
version = "0.1.0"
description = "Viku - sermon to vertical reels engine (FastAPI)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "soundfile>=0.12",
]

[project.scripts]
viku-engine = "viku.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viku"]

[dependency-groups]
dev = ["httpx>=0.27"]
