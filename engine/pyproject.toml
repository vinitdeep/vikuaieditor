[project]
name = "viku-engine"
version = "0.1.0"
description = "Viku - sermon to vertical reels engine (FastAPI)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "soundfile>=0.12",
    "onnxruntime>=1.32.0",
    "tokenizers>=0.23.3",
    "pillow>=13.0.0",
]

[project.scripts]
viku-engine = "viku.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viku"]

[dependency-groups]
dev = ["httpx>=0.27"]
# Speech recognition runners (run as subprocesses of the engine, same env):
#   IndicConformer (vendored viku/runners/indic_model.py: TorchScript preprocessor + ONNX) and faster-whisper.
asr = [
    "torch>=2.5",
    "faster-whisper>=1.1",
]

[tool.uv]
# `uv sync` (dev) installs the ASR runners too; the installer runs `uv sync --frozen --no-dev --group asr`.
default-groups = ["dev", "asr"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
