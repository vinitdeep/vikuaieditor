# Viku installer: npm run dist  ->  release/Viku-Setup-<version>.exe
# Per-user NSIS install (no admin), desktop + start-menu shortcuts. The engine ships as source + uv.lock and is built
# into <install>\engine-env on first launch by bootstrap.ps1 with the bundled, SHA-256-verified uv.exe.
appId: org.viku.sermonreelstudio
productName: Viku
copyright: Copyright © 2026 Viku
directories:
  output: release
  buildResources: build
# main / preload / renderer are fully bundled by electron-vite (no runtime node_modules)
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
  - "!node_modules/**"
extraResources:
  - from: ../engine
    to: engine
    filter:
      - "**/*"
      - "!.venv/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.pytest_cache/**"
      - "!**/.ruff_cache/**"
      - "!**/.mypy_cache/**"
      - "!**/tests/**"
      - "!.viku-bootstrap.json"
  - from: vendor/uv
    to: uv
    filter:
      - uv.exe
      - LICENSE-MIT
      - LICENSE-APACHE
      - VERSION.txt
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Viku
  # not code-signed yet (no certificate): Windows SmartScreen will ask once
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Viku
  menuCategory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: Viku
  artifactName: Viku-Setup-${version}.${ext}
  include: build/installer.nsh
